# Zensical configuration file

[project]
site_name = "Eurekaimer's Digital Garden"
site_description = "My Note and Learning Repository"
site_author = "Eurekaimer"
site_url = "https://www.eurekaimer.xyz/Stathelper"
repo_url = "https://github.com/Eurekaimer/Stathelper"

copyright = """
Copyright &copy; 2024-2026 Eurekaimer
"""

edit_uri = "https://github.com/Eurekaimer/Stathelper/edit/main/docs/"

nav = [
   { "Stathelper" = "index.md" },
   { "HDP" = [
        "HDP/index.md",
        { "Chapter 1" = "HDP/Chapter-1.md" },
        ]},
    { "STAT260" = [
        "STAT260/index.md",
        { "Chapter 1" = "STAT260/Chapter-1.md" },
        ]},
    { "CS" = [
        { "CS Learning" = "CS/index.md" },
        { "Deep Learning" = [
            { "Deep Learning" = "CS/DL/index.md" },
            { "CS231n" = "CS/CS231n/CS231n.md" },
        ]},
        { "CS Introduction" = [
            {"CS61A" = "CS/CS61A/index.md"},
        ]},
    ]},
    { "Analysis" = [
        "Analysis/index.md",
        { "Mathematical Analysis" = [
            { "南开大学数学分析课本答案" = [
                "Analysis/南开大学数学分析答案/index.md",
                { "多元函数的极限与连续" = "Analysis/南开大学数学分析答案/多元函数的极限与连续.md"},
            ]},
            { "Lecture Notes" = [
                "Analysis/数学分析(Lecture Notes)/index.md",
                { "多元函数的极限与连续" = "Analysis/数学分析(Lecture Notes)/预备知识(数学分析).md"},
            ]},
        ]},
    ]},
    { "ACG" = [
        "ACG/Yuri.md",
        "ACG/Anime.md",
        { "Galgame" = [
            "Galgame/index.md",
            { "仅你一人" = "Galgame/only-you.md"},
            { "Flowers Spring" = "Galgame/only-you.md"},
        ]},
        ]},
    { "NixOS" = [
        "NixOS/index.md",
        "NixOS/如何使用NixOS玩明日方舟.md",
        ]},
    { "Tech" = [
        "WebSource/index.md",
        { "Source Websites" = [
            { "Computer Science" = "WebSource/计算机科学资料站.md"},
            { "Math and Statistics" = "WebSource/数学与统计资料站.md"},
        ]},
        { "Open Source Software" = [
            { "Sioyek" = "WebSource/Sioyek.md"},
        ]},
        { "克林索尔的最后夏天" = "WebSource/克林索尔的最后夏天.md" },
        ]},
    { "Friends Link" = "friends-link.md" },
]


extra_css = [
    "stylesheets/extra.css",
    "stylesheets/anime-grid.css",
    "stylesheets/key.css",
    "stylesheets/mouse-color.css",
    "https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css",  # 霞鹜文楷
]

extra_javascript = [
    "javascripts/mathjax.js",
    "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js"
]

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

# Admonitions and details
[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]

# Grids
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]

# Task Lists
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

# toc link
[project.markdown_extensions.toc]
permalink = "⚓︎"
toc_depth = 3

[project.theme]
variant = "modern"
custom_dir = "overrides"
favicon = "images/xiaoju.jpg"
language = "zh"

features = [
    "announce.dismiss",
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "header.autohide",
    "navigation.expand",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.path",
    "navigation.prune",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
    # "toc.integrate", # 子目录进入右侧
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.theme.font]
text = "LXGW WenKai"  
code = "Roboto Mono" 

[project.theme.icon]
logo = "lucide/pi"
repo = "fontawesome/brands/github"

[project.theme.icon.admonition]
note = "fontawesome/solid/note-sticky"
abstract = "fontawesome/solid/book"
info = "fontawesome/solid/circle-info"
tip = "fontawesome/solid/bullhorn"
success = "fontawesome/solid/check"
question = "fontawesome/solid/circle-question"
warning = "fontawesome/solid/triangle-exclamation"
failure = "fontawesome/solid/bomb"
danger = "fontawesome/solid/skull"
bug = "fontawesome/solid/robot"
example = "fontawesome/solid/flask"
quote = "fontawesome/solid/quote-left"
tldr = "fontawesome/solid/cube"

# ----------------------------------------------------------------------------
# The "extra" section contains miscellaneous settings. material/mdi/wechat
